name: ddev-docktopus-postgres

ddev_version_constraint: '>= v1.24.10'

project_files:
  - docker-compose.node-postgres.yaml
  - .env.ddev-docktopus-postgres
  - docktopus-postgres/scaffold

post_install_actions:
  - |
    #ddev-description:Create the postgres-init seed if the project has none
    if [ ! -f ../postgres-init/init.sql ]; then
      mkdir -p ../postgres-init
      cp -a docktopus-postgres/scaffold/init.sql ../postgres-init/init.sql
      echo "ddev-docktopus-postgres: created postgres-init/init.sql seed (runs on first database start only)."
    else
      echo "ddev-docktopus-postgres: existing postgres-init/init.sql left untouched."
    fi
    rm -rf docktopus-postgres

removal_actions:
  - |
    #ddev-description:Remove the generated postgres-init seed if unmodified
    if [ -f ../postgres-init/init.sql ] && grep -q '#ddev-generated' ../postgres-init/init.sql; then
      rm -f ../postgres-init/init.sql
      rmdir ../postgres-init 2>/dev/null || true
    fi
